name: Daily Apartment Deals Collector

on:
  schedule:
    # 매일 UTC 21:00 (한국 시간 오전 06:00 KST) 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치 및 환경 세팅
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Python 설치
        run: uv python install 3.12

      - name: 프로젝트 의존성 설치
        run: uv sync

      - name: API 키 연결 상태 사전 검증
        run: |
          if [ -z "${{ secrets.MOLIT_API_KEY }}" ]; then
            echo "::error::GitHub Secrets에 MOLIT_API_KEY가 설정되지 않았습니다! 리포지토리의 Settings > Secrets and variables > Actions 에 MOLIT_API_KEY를 등록해 주세요."
            exit 1
          fi
          echo "MOLIT_API_KEY 시크릿이 정상적으로 연결되어 있습니다."

      - name: 전국 아파트 실거래가 수집 실행
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          uv run python -m src.collector --days 7

      - name: 당일 AI 부동산 마켓 리포트 자동 생성 및 저장
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 감지됨: 최신 일자 AI 애널리스트 리포트 자동 생성 실행..."
            uv run python -m src.analyzer --auto-daily
          else
            echo "::warning::GitHub Secrets에 GEMINI_API_KEY가 설정되지 않아 당일 AI 리포트 자동 생성을 건너뜁니다."
          fi

      - name: 최신 데이터 및 AI 리포트 Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_deals.parquet data/ai_daily_summaries.json data/apt_deals.db
          
          if git diff --staged --quiet; then
            echo "새로 변경되거나 추가된 거래 데이터 및 AI 리포트가 없습니다."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "chore(data): auto-update apt deals and AI market report [${TODAY}]"
            git push
            echo "최신 실거래 데이터와 AI 리포트가 성공적으로 GitHub에 푸시되었습니다."
          fi

[project]
name = "apt-daily"
version = "0.1.0"
description = "전국 아파트 실거래가 수집 및 Streamlit 대시보드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.39.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


